name: Testes e deploy GitHub Pages
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check src/calculator.js
          node --check src/app.js
          node --check src/timeline.js
          node --check scripts/browser-smoke.mjs
          node --check src/v2.js
          node --check src/commerce.js
          node --check src/quotations.js
          node --check src/slicer.js
          node --check src/slicerAdapters.js
          node --check src/slicerImportUI.js
          node --check src/zipImport.js
          node --check src/lotPlanner.js
      - name: Testar motor de preços
        run: node --test tests/*.test.mjs
      - name: Instalar navegador para testes de interface
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Teste integrado da interface real
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/3d-price-http.log 2>&1 &
          sleep 2
          node scripts/browser-smoke.mjs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
